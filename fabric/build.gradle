plugins {
	id 'info.solidsoft.pitest' version '1.19.0'
}

workspaceDependencies {
	siblingMaven('BrainageLib') {
		coordinate.set("io.github.brainage04:brainagelib:${rootProject.brainagelib_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../BrainageLib'))
	}
	siblingMaven('BrainageLibGameTest') {
		coordinate.set("io.github.brainage04:brainagelib-gametest:${rootProject.brainagelib_version}")
		siblingDirectory.set(rootProject.layout.projectDirectory.dir('../BrainageLib'))
	}
}

dependencies {
	implementation "io.github.brainage04:brainagelib:${project.brainagelib_version}"
	productionRuntimeMods "io.github.brainage04:brainagelib:${project.brainagelib_version}"
	// Test-only GameTest fixtures; productionRuntimeMods feeds the production GameTest runs, not the release JAR.
	gametestImplementation "io.github.brainage04:brainagelib-gametest:${project.brainagelib_version}"
	productionRuntimeMods "io.github.brainage04:brainagelib-gametest:${project.brainagelib_version}"
}

pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['io.github.brainage04.telekinesis.config.TelekinesisConfigManager']
	targetTests = ['io.github.brainage04.telekinesis.TelekinesisConfigManagerTest']
	additionalMutableCodePaths = project(':common').sourceSets.main.output.classesDirs.files
	threads = 1
	timeoutConstInMillis = 5000
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
tasks.named('pitest') {
	dependsOn ':common:classes'
	// With fabric-loader-junit on the classpath, the tests run but PIT records no coverage, so every
	// mutant counts as uncovered (measured in SimpleTwitchChat, 7d3798b).
	// TelekinesisConfigManagerTest does not need the Fabric loader.
	def classpath = files(additionalClasspath.from.toList())
	additionalClasspath.setFrom(classpath.filter { !it.name.startsWith('fabric-loader-junit') })
}
