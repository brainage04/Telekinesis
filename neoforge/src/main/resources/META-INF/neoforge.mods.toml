modLoader="javafml"
loaderVersion="[11,)"
license="MIT"
issueTrackerURL="https://github.com/brainage04/Telekinesis/issues"

[[mods]]
modId="telekinesis"
version="${version}"
displayName="Telekinesis"
description='''A server-side mod that puts drops and experience straight into the inventory and experience total of the player who caused them. That covers blocks the player mines, the leaves of trees the player cuts, mobs the game credits the player with killing, item frames, paintings, cushions, armour stands, boats and minecarts the player breaks, and blocks broken by explosions the player causes. Vanilla clients can join without installing the mod.'''
iconFile="assets/telekinesis/icon.png"
authors="brainage04"
displayURL="https://github.com/brainage04/Telekinesis"

[[dependencies.telekinesis]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.telekinesis]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.telekinesis]]
modId="brainagelib"
type="required"
versionRange="[${brainagelib_version},3.0.0)"
ordering="AFTER"
side="SERVER"
