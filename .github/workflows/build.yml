# Build and production GameTest checks for every change.
name: build

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_client_gametests:
        description: Run headless client GameTests
        required: false
        type: boolean
        default: true
      record_client_gametests:
        description: Record client GameTests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-mod-build.yml@v3.5.0
    with:
      prepare_siblings: BrainageLib@a4c8113859b71a2d5e32a97c53c03dbd722e9a72

  client-gametests:
    if: ${{ vars.RUN_CLIENT_GAMETESTS != 'false' && (github.event_name != 'workflow_dispatch' || inputs.run_client_gametests || inputs.record_client_gametests) }}
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-client-gametests.yml@v3.5.0
    with:
      prepare_siblings: BrainageLib@a4c8113859b71a2d5e32a97c53c03dbd722e9a72
      run_client_gametests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_client_gametests }}
      client_gametest_profile: smoke
      record_client_gametests: ${{ github.event_name == 'workflow_dispatch' && inputs.record_client_gametests }}

  production-gametests:
    uses: brainage04/MinecraftModConventions/.github/workflows/reusable-production-gametests.yml@v3.5.0
    with:
      prepare_siblings: BrainageLib@a4c8113859b71a2d5e32a97c53c03dbd722e9a72
